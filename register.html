<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Register School — The Eye</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="./design-tokens.css">
<link rel="stylesheet" href="./auth-hero.css">
</head>
<body>

<div class="hero-panel">
  <div class="hero-glow-layer" aria-hidden="true">
    <div class="hero-glow-top"></div>
    <div class="hero-glow-bottom"></div>
    <div class="hero-glow-lime"></div>
    <div class="hero-scrim"></div>
  </div>

  <header class="auth-topbar">
    <button type="button" class="auth-back-btn" id="backToLoginBtn">
      <i class="fas fa-arrow-left" aria-hidden="true"></i>
      <span>Back</span>
    </button>
    <a href="./index.html" class="nav-brand" style="background:rgba(24,24,23,0.88);border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:6px 14px 6px 6px;">
      <span class="nav-logo-mark" aria-hidden="true"><i class="fas fa-eye"></i></span>
      <span class="nav-brand-name">The Eye</span>
    </a>
  </header>

  <main class="hero-main">
    <section class="auth-card auth-card--wide" aria-label="Register your school">
      <h1 class="auth-card-title">Register your school</h1>
      <p class="auth-card-sub">Submit your school details to get started.</p>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="schoolName" class="field-label">School name</label>
          <input type="text" id="schoolName" class="auth-input" placeholder="e.g. Harvard Academy" required>
        </div>
        <div class="form-group">
          <label for="contactPerson" class="field-label">Your full name</label>
          <input type="text" id="contactPerson" name="contact_person" class="auth-input" placeholder="e.g. Kamran Ali" required>
        </div>
        <div class="form-group">
          <label for="contactRole" class="field-label">Your role</label>
          <input type="text" id="contactRole" name="role" class="auth-input" placeholder="e.g. Principal, Owner, Admin" required>
        </div>
        <div class="form-group">
          <label for="contactEmail" class="field-label">Contact email</label>
          <input type="email" id="contactEmail" name="contact_email" class="auth-input" placeholder="e.g. admin@school.com" required>
        </div>
        <div class="form-group">
          <label for="message" class="field-label">Message (optional)</label>
          <textarea id="message" class="auth-textarea" placeholder="Any additional information..."></textarea>
        </div>

        <div class="auth-msg" id="registerMsg" role="alert"></div>

        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;">
          <button type="button" class="secondary-pill-btn" style="flex:1 1 120px;" onclick="handleBackClick()">Back</button>
          <button type="submit" class="lime-pill-btn" id="submitBtn" style="flex:2 1 180px;">
            <span id="btnText">Send Request</span>
          </button>
        </div>
      </form>
    </section>
  </main>
</div>

<script src="./api-config.js"></script>
<script>
function hasTypedData() {
  return ['schoolName', 'contactPerson', 'contactRole', 'contactEmail', 'message']
    .some(id => (document.getElementById(id)?.value || '').trim().length > 0);
}

function handleBackClick() {
  if (hasTypedData() && !window.confirm('Discard your entered details and go back to sign in?')) {
    return;
  }
  window.location.href = './index.html';
}

document.getElementById('backToLoginBtn').addEventListener('click', handleBackClick);

async function handleRegister(e) {
  e.preventDefault();
  const schoolName = document.getElementById('schoolName').value.trim();
  const contactPerson = document.getElementById('contactPerson').value.trim();
  const contactRole = document.getElementById('contactRole').value.trim();
  const contactEmail = document.getElementById('contactEmail').value.trim();
  const message = document.getElementById('message').value.trim();
  const msgEl = document.getElementById('registerMsg');
  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');

  msgEl.classList.remove('show', 'success', 'error');
  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner" aria-hidden="true"></span> Sending...';

  try {
    const res = await fetch((window.API_BASE || '') + '/api/auth/register-school', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ school_name: schoolName, contact_person: contactPerson, role: contactRole, contact_email: contactEmail, message })
    });
    const data = await res.json();

    if (!res.ok) {
      msgEl.textContent = data.error || 'Failed to submit request.';
      msgEl.className = 'auth-msg error show';
      btn.disabled = false;
      btnText.textContent = 'Send Request';
      return;
    }

    msgEl.textContent = 'Your request has been received. You will be contacted shortly.';
    msgEl.className = 'auth-msg success show';
    document.getElementById('registerForm').reset();
    btn.disabled = false;
    btnText.textContent = 'Send Request';
  } catch (err) {
    msgEl.textContent = 'Connection error. Please check your internet and try again.';
    msgEl.className = 'auth-msg error show';
    btn.disabled = false;
    btnText.textContent = 'Send Request';
  }
}
</script>
</body>
</html>
