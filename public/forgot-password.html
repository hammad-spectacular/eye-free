<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Forgot Password — The Eye</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="./design-tokens.css">
<link rel="stylesheet" href="./auth-hero.css">
</head>
<body>

<div class="hero-panel">
  <div class="hero-glow-layer" aria-hidden="true">
    <div class="hero-glow-top"></div>
    <div class="hero-glow-bottom"></div>
    <div class="hero-glow-lime"></div>
    <div class="hero-scrim"></div>
  </div>

  <header class="auth-topbar">
    <a href="/index.html" class="auth-back-btn">
      <i class="fas fa-arrow-left" aria-hidden="true"></i>
      <span>Back</span>
    </a>
    <a href="/index.html" class="nav-brand" style="background:rgba(24,24,23,0.88);border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:6px 14px 6px 6px;">
      <span class="nav-logo-mark" aria-hidden="true"><i class="fas fa-eye"></i></span>
      <span class="nav-brand-name">The Eye</span>
    </a>
  </header>

  <main class="hero-main">
    <section class="auth-card" aria-label="Forgot password">
      <h1 class="auth-card-title">Forgot password?</h1>
      <p class="auth-card-sub">Enter your Full ID to receive a reset link.</p>

      <form id="forgotForm" onsubmit="handleForgotPassword(event)">
        <div class="form-group">
          <label for="fullId" class="field-label">Full ID</label>
          <input type="text" id="fullId" class="auth-input" placeholder="e.g. HARV-T001" autocomplete="username" required>
        </div>

        <div class="auth-msg" id="statusMsg" role="alert"></div>

        <button type="submit" class="lime-pill-btn" id="submitBtn">
          <span id="btnText">Send Reset Link</span>
        </button>
      </form>
    </section>
  </main>
</div>

<script src="api-config.js"></script>
<script>
async function handleForgotPassword(e) {
  e.preventDefault();
  const fullId = document.getElementById('fullId').value.trim();
  const msgEl = document.getElementById('statusMsg');
  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');

  msgEl.classList.remove('show', 'error', 'success');

  if (!fullId) {
    msgEl.textContent = 'Enter your Full ID.';
    msgEl.className = 'auth-msg error show';
    return;
  }

  if (fullId !== 'SUPER-ADM' && fullId.indexOf('-') === -1) {
    msgEl.textContent = 'Invalid ID format. Your ID should look like HARV-T001.';
    msgEl.className = 'auth-msg error show';
    return;
  }

  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner" aria-hidden="true"></span> Sending...';

  try {
    const res = await fetch((window.API_BASE || '') + '/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ full_id: fullId.toUpperCase() })
    });
    const data = await res.json();

    if (!res.ok) {
      msgEl.textContent = data.error || 'Something went wrong. Please try again later.';
      msgEl.className = 'auth-msg error show';
      btn.disabled = false;
      btnText.textContent = 'Send Reset Link';
      return;
    }

    msgEl.textContent = data.message || 'If an account with that ID exists, a password reset link has been sent.';
    msgEl.className = 'auth-msg success show';
    btn.disabled = false;
    btnText.textContent = 'Send Reset Link';
  } catch (err) {
    msgEl.textContent = 'Connection error. Please check your internet and try again.';
    msgEl.className = 'auth-msg error show';
    btn.disabled = false;
    btnText.textContent = 'Send Reset Link';
  }
}
</script>
</body>
</html>
