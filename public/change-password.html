<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Change Password — The Eye</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="./design-tokens.css">
<link rel="stylesheet" href="./auth-hero.css">
</head>
<body>

<div class="hero-panel">
  <div class="hero-glow-layer" aria-hidden="true">
    <div class="hero-glow-top"></div>
    <div class="hero-glow-bottom"></div>
    <div class="hero-glow-lime"></div>
    <div class="hero-scrim"></div>
  </div>

  <header class="auth-topbar">
    <a href="/index.html" class="auth-back-btn" id="backBtn">
      <i class="fas fa-arrow-left" aria-hidden="true"></i>
      <span>Back</span>
    </a>
    <a href="/index.html" class="nav-brand" style="background:rgba(24,24,23,0.88);border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:6px 14px 6px 6px;">
      <span class="nav-logo-mark" aria-hidden="true"><i class="fas fa-eye"></i></span>
      <span class="nav-brand-name">The Eye</span>
    </a>
  </header>

  <main class="hero-main">
    <section class="auth-card" aria-label="Change password">
      <div class="header">
        <h1 class="auth-card-title">Set Your Password</h1>
        <p class="auth-card-sub">You must set a new password before continuing.</p>
      </div>

      <div class="notice auth-msg show" style="background:rgba(229,161,0,0.14);border:1px solid rgba(229,161,0,0.35);color:#FDE68A;">
        Welcome! Please create a new password to secure your account.
      </div>

      <form id="passwordForm" onsubmit="handleChangePassword(event)">
        <div class="form-group" id="currentPasswordGroup">
          <label for="currentPassword" class="field-label">Current password</label>
          <div class="input-wrap">
            <input type="password" id="currentPassword" class="auth-input" placeholder="Enter your current password" autocomplete="current-password">
            <button type="button" class="toggle-pw" onclick="togglePw('currentPassword', this)" aria-label="Show password">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="newPassword" class="field-label">New password</label>
          <div class="input-wrap">
            <input type="password" id="newPassword" class="auth-input" placeholder="Min. 8 chars with a special character" required minlength="8" autocomplete="new-password">
            <button type="button" class="toggle-pw" onclick="togglePw('newPassword', this)" aria-label="Show password">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword" class="field-label">Confirm new password</label>
          <div class="input-wrap">
            <input type="password" id="confirmPassword" class="auth-input" placeholder="Re-enter your new password" required autocomplete="new-password">
            <button type="button" class="toggle-pw" onclick="togglePw('confirmPassword', this)" aria-label="Show password">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="auth-msg" id="passwordMsg" role="alert"></div>

        <button type="submit" class="lime-pill-btn" id="submitBtn" disabled>
          <span id="btnText">Change Password</span>
        </button>
      </form>
    </section>
  </main>
</div>

<script src="./api-config.js"></script>
<script>
let API_BASE = (typeof window !== 'undefined' && window.API_BASE) ? window.API_BASE : '';

function authHeader() {
  const token = localStorage.getItem('auth_token');
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

let redirectAfter = '/';

function currentPasswordVisible() {
  return document.getElementById('currentPasswordGroup').style.display !== 'none';
}

function setChangeMode() {
  document.getElementById('currentPasswordGroup').style.display = 'block';
  document.getElementById('currentPassword').setAttribute('required', 'required');
  document.querySelector('.header h1').textContent = 'Change Password';
  document.querySelector('.header p').textContent = 'Enter your current password to set a new one.';
  document.querySelector('.notice').style.display = 'none';
  document.getElementById('btnText').textContent = 'Change Password';
}

async function handleChangePassword(e) {
  e.preventDefault();
  const currentPasswordEl = document.getElementById('currentPassword');
  const newPw = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const msgEl = document.getElementById('passwordMsg');
  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');

  msgEl.classList.remove('show', 'error', 'success');

  if (newPw !== confirm) {
    msgEl.textContent = 'New passwords do not match.';
    msgEl.className = 'auth-msg error show';
    return;
  }
  if (newPw.length < 8) {
    msgEl.textContent = 'Password must be at least 8 characters.';
    msgEl.className = 'auth-msg error show';
    return;
  }

  const specialChars = /[!@#$%^&*(),.?":{}|<>]/;
  if (!specialChars.test(newPw)) {
    msgEl.textContent = 'Password must contain at least one special character (!@#$%^&*(),.?":{}|<>).';
    msgEl.className = 'auth-msg error show';
    return;
  }

  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner" aria-hidden="true"></span> Saving...';

  const requestBody = {
    new_password: newPw,
    confirm_password: confirm
  };
  if (currentPasswordVisible()) {
    requestBody.current_password = currentPasswordEl.value;
  }

  try {
    const res = await fetch(API_BASE + '/api/auth/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeader() },
      body: JSON.stringify(requestBody)
    });
    const data = await res.json();

    if (!res.ok) {
      const serverError = data.error || 'Failed to change password.';
      msgEl.textContent = serverError;
      msgEl.className = 'auth-msg error show';
      if (/current password/i.test(serverError) && !currentPasswordVisible()) {
        setChangeMode();
        currentPasswordEl.focus();
      }
      btn.disabled = false;
      btnText.textContent = currentPasswordVisible() ? 'Change Password' : 'Set Password';
      return;
    }

    if (data.token) localStorage.setItem('auth_token', data.token);
    msgEl.textContent = 'Password set successfully! Redirecting...';
    msgEl.className = 'auth-msg success show';

    setTimeout(() => {
      window.location.href = data.redirect_url || redirectAfter;
    }, 500);
  } catch (err) {
    msgEl.textContent = 'Connection error. Please check your internet and try again.';
    msgEl.className = 'auth-msg error show';
    btn.disabled = false;
    btnText.textContent = currentPasswordVisible() ? 'Change Password' : 'Set Password';
  }
}

function togglePw(inputId, btn) {
  const input = document.getElementById(inputId);
  const isPassword = input.type === 'password';
  input.type = isPassword ? 'text' : 'password';
  btn.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
  btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
}

async function checkSession() {
  const token = localStorage.getItem('auth_token');
  if (!token) { window.location.href = '/index.html'; return; }
  try {
    const res = await fetch(API_BASE + '/api/auth/me', { headers: authHeader() });
    const data = await res.json();
    if (res.ok) {
      const redirectMap = { super_admin: '/super-admin.html', admin: '/admin.html', teacher: '/teacher.html', student: '/student.html', coordinator: '/coordinator.html' };
      redirectAfter = redirectMap[data.role] || '/';
      const backBtn = document.getElementById('backBtn');
      if (backBtn) backBtn.href = redirectAfter;

      if (data.is_first_login) {
        document.getElementById('currentPassword').removeAttribute('required');
        document.querySelector('.header h1').textContent = 'Set Your Password';
        document.querySelector('.header p').textContent = 'Create a secure password for your account.';
        document.getElementById('btnText').textContent = 'Set Password';
      } else {
        setChangeMode();
      }
      document.getElementById('submitBtn').disabled = false;
    } else {
      localStorage.removeItem('auth_token');
      window.location.href = '/index.html';
    }
  } catch (e) {
    window.location.href = '/index.html';
  }
}
checkSession();
</script>
<script src="./idle-logout.js"></script>
</body>
</html>
