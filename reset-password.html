<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reset Password — The Eye</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="./design-tokens.css">
<link rel="stylesheet" href="./auth-hero.css">
</head>
<body>

<div class="hero-panel">
  <div class="hero-glow-layer" aria-hidden="true">
    <div class="hero-glow-top"></div>
    <div class="hero-glow-bottom"></div>
    <div class="hero-glow-lime"></div>
    <div class="hero-scrim"></div>
  </div>

  <header class="auth-topbar">
    <a href="/index.html" class="auth-back-btn">
      <i class="fas fa-arrow-left" aria-hidden="true"></i>
      <span>Back</span>
    </a>
    <a href="/index.html" class="nav-brand" style="background:rgba(24,24,23,0.88);border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:6px 14px 6px 6px;">
      <span class="nav-logo-mark" aria-hidden="true"><i class="fas fa-eye"></i></span>
      <span class="nav-brand-name">The Eye</span>
    </a>
  </header>

  <main class="hero-main">
    <!-- Invalid/missing token view -->
    <section class="auth-card" id="invalidTokenCard" style="display:none;text-align:center;">
      <h1 class="auth-card-title">Invalid link</h1>
      <p class="auth-card-sub">This password reset link is invalid or has expired.</p>
      <a href="/forgot-password.html" class="lime-pill-btn" style="text-decoration:none;">Request a new link</a>
    </section>

    <!-- Reset form view -->
    <section class="auth-card" id="resetFormCard" aria-label="Reset password">
      <h1 class="auth-card-title">Reset password</h1>
      <p class="auth-card-sub">Enter your new password below.</p>

      <form id="resetForm" onsubmit="handleResetPassword(event)">
        <div class="form-group">
          <label for="newPassword" class="field-label">New password</label>
          <input type="password" id="newPassword" class="auth-input" placeholder="At least 8 characters with special character" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmPassword" class="field-label">Confirm new password</label>
          <input type="password" id="confirmPassword" class="auth-input" placeholder="Re-enter new password" required autocomplete="new-password">
        </div>

        <div class="auth-msg" id="statusMsg" role="alert"></div>

        <button type="submit" class="lime-pill-btn" id="submitBtn">
          <span id="btnText">Reset Password</span>
        </button>
      </form>
    </section>
  </main>
</div>

<script src="api-config.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const resetToken = urlParams.get('token');

if (!resetToken) {
  document.getElementById('resetFormCard').style.display = 'none';
  document.getElementById('invalidTokenCard').style.display = 'block';
}

async function handleResetPassword(e) {
  e.preventDefault();
  const newPw = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const msgEl = document.getElementById('statusMsg');
  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');

  msgEl.classList.remove('show', 'error', 'success');

  if (newPw !== confirm) {
    msgEl.textContent = 'Passwords do not match.';
    msgEl.className = 'auth-msg error show';
    return;
  }
  if (newPw.length < 8) {
    msgEl.textContent = 'Password must be at least 8 characters.';
    msgEl.className = 'auth-msg error show';
    return;
  }
  const specialChars = /[!@#$%^&*(),.?":{}|<>]/;
  if (!specialChars.test(newPw)) {
    msgEl.textContent = 'Password must contain at least one special character (!@#$%^&*(),.?":{}|<>).';
    msgEl.className = 'auth-msg error show';
    return;
  }

  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner" aria-hidden="true"></span> Resetting...';

  try {
    const res = await fetch((window.API_BASE || '') + '/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: resetToken,
        new_password: newPw,
        confirm_password: confirm
      })
    });
    const data = await res.json();

    if (!res.ok) {
      msgEl.textContent = data.error || 'Failed to reset password.';
      msgEl.className = 'auth-msg error show';
      btn.disabled = false;
      btnText.textContent = 'Reset Password';
      return;
    }

    msgEl.textContent = 'Password reset successfully! Redirecting to sign in...';
    msgEl.className = 'auth-msg success show';
    btn.style.display = 'none';

    setTimeout(() => {
      window.location.href = '/index.html';
    }, 1500);
  } catch (err) {
    msgEl.textContent = 'Connection error. Please check your internet and try again.';
    msgEl.className = 'auth-msg error show';
    btn.disabled = false;
    btnText.textContent = 'Reset Password';
  }
}
</script>
</body>
</html>
